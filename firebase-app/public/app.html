    modal(`<h2>Document & tag ${esc(v.name)}</h2>
      <div class="f"><label for="m_id">ID document checked</label><select id="m_id"><option>National ID (NIN)</option><option>International passport</option><option>Driver's licence</option><option>Staff / agency ID</option><option>Other</option></select></div>
      <div class="f" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="m_print" style="width:auto" ${passFor(v)?"":"checked"}><label for="m_print">Print a paper badge${passFor(v)?" (visitor has a digital pass)":""}</label></div>
      ${v.agreedAt?`<div class="small" style="color:var(--ok)">✓ <a href="?rules" target="_blank" rel="noopener">Visitor rules</a> accepted ${fmtD(v.agreedAt)}</div>`:`<div class="f" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="m_agree" style="width:auto"><label for="m_agree">Visitor has read and accepted the <a href="?rules" target="_blank" rel="noopener">visitor rules and privacy notice</a></label></div>`}
      <div class="f"><label for="m_items">Items brought in (one per line, e.g. "Laptop, Dell, serial 5CD12")</label><textarea id="m_items" style="min-height:56px"></textarea></div>
      <div class="f"><label for="m_tag">Tag number</label><input id="m_tag" value="${pre}-${String(i).padStart(3,"0")}"></div>
      <div class="badge"><div class="hd">UN House Abuja · ${v.type==="vip"?"VIP":v.type==="contractor"?"Contractor":"Visitor"}</div><b>${esc(v.name)}</b><div class="small">${esc(v.org)}</div><div class="small">Host: ${esc(v.host)} · ${esc(v.building)}</div><div class="ref" style="margin-top:6px">${esc(v.ref)} · ${fmtD(now())}</div></div>`,
      ()=>{const tag=$("#m_tag").value.trim(), printIt=$("#m_print").checked, t=opNow(v,4); if(!tag) return false; if(used.has(tag)){toast(`Tag ${tag} is already issued.`);return false}
        act(v,`Documented (${$("#m_id").value}); tag ${tag} issued`,{status:"tagged",tag,idType:$("#m_id").value,taggedAt:t,
          ...($("#m_agree")&&$("#m_agree").checked?{agreedAt:t,agreement:AGREEMENT.version}:{}),
          ...($("#m_items").value.trim()?{items:$("#m_items").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,20).map(d=>({d,out:false}))}:{})}).then(()=>{toast(`Tag ${tag} issued to ${v.name}.`);if(printIt)printBadge({...v,tag,taggedAt:t})})});
    return;
  }
  if(a==="checkout"){
    const pad=n=>String(n).padStart(2,"0"), d=new Date(opNow(v,45)), nowHM=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    modal(`<h2>Check out ${esc(v.name)}</h2><p class="small">Inside since ${fmtT(v.inAt)}.${v.tag?` Collect tag <b class="mono">${esc(v.tag)}</b>.`:""}</p>
      <div class="f"><label for="m_out">Time of check-out</label><input type="time" id="m_out" value="${nowHM}"><span class="small">Change it only if the visitor left earlier than now.</span></div>
      <div id="m_err" class="small" style="color:var(--bad)"></div>
      ${v.tag?`<div class="f" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="m_ret" checked style="width:auto"><label for="m_ret">Tag returned</label></div>`:""}
      ${(v.items||[]).length?`<div class="f"><label>Items taken out</label>${v.items.map((it,i)=>`<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-item="${i}" checked style="width:auto"> ${esc(it.d)}</label>`).join("")}</div>`:""}
      ${canAct("extendstay")?`<div class="small" style="border-top:1px solid var(--line);padding-top:10px">Not leaving yet? <a href="#" id="m_ext_link">Extend stay (exceptional case · requires host permission)</a></div>`:""}`,
      ()=>{const [h,m]=($("#m_out").value||nowHM).split(":").map(Number); const t=new Date(v.inAt||now()); t.setHours(h,m,0,0); let out=t.getTime();
        const maxOut=(!DEMO&&fb)?now()+60000:day0(v.inAt||now())+WORK_END*3600e3;
        if(out>maxOut){$("#m_err").textContent=(!DEMO&&fb)?"The check-out time can't be in the future.":"Choose a check-out time within working hours (up to 17:00).";return false}
        if(v.inAt&&out<v.inAt){$("#m_err").textContent=`The check-out time can't be before check-in (${fmtT(v.inAt)}).`;return false}
        const late=now()-out>5*60000, ret=$("#m_ret")?$("#m_ret").checked:true;
        const items=(v.items||[]).map((it,i)=>({...it,out:!!(document.querySelector(`[data-item="${i}"]`)||{}).checked})), left=items.filter(x=>!x.out).map(x=>x.d);
        act(v,`Checked out at ${fmtT(out)}${late?` (recorded at ${fmtT(now())})`:""}${left.length?`; items NOT taken out: ${left.join(", ")}`:""}${v.tag?(ret?`; tag ${v.tag} returned`:`; tag ${v.tag} NOT returned`):""}`,{status:"out",outAt:out,outRecordedAt:now(),tagReturned:ret,...(items.length?{items}:{})}).then(()=>toast(`${v.name} checked out at ${fmtT(out)}.`))});
    const xl=$("#m_ext_link"); if(xl) xl.onclick=e=>{e.preventDefault();doAct("extendstay",v)};
    return;
  }
  if(a==="detail"){
    const m=$("#modal"); m.innerHTML=`<div class="modal" style="max-width:560px"><h2>${esc(v.name)} ${tpill(v)}</h2><div class="small">${esc(v.org)} · <span class="ref">${esc(v.ref)}</span> · ${pill(v)}${v.vehicle?` · <span class="mono">🚗 ${esc(v.vehicle)}</span>`:""}</div><div class="small">Host ${esc(v.host)} (${esc(v.agency)})${v.backupHost?` · Backup: ${esc(v.backupHost)}`:""} · ${esc(v.building)}${v.room?" · "+esc(v.room):""} · ${esc(v.purpose)}${v.escort||v.restricted?" · <b>Escort required</b>":""}</div><div class="small">Requested by ${esc(v.requestedBy||v.host)}${v.decidedBy?` · ${v.status==="rejected"?"Rejected":"Approved"} by <b>${esc(v.decidedBy)}</b>${v.decidedAt?" ("+fmtD(v.decidedAt)+")":""}`:" · awaiting approval"}</div>${v.rejectReason?`<div class="small" style="color:var(--bad)">Rejection reason: <b>${esc(v.rejectReason)}</b></div>`:""}<div class="tw" style="max-height:300px;overflow:auto"><table><tbody>${(v.log||[]).slice().reverse().map(l=>`<tr><td class="mono">${fmtD(l.t)}</td><td>${esc(l.a)}<div class="small">${esc(l.by)} · ${esc(l.st)}</div></td></tr>`).join("")}</tbody></table></div><div class="acts">${passLive(v.status)&&canAct("pass")?`<button class="btn pri" id="mPass">Live digital pass</button>`:""}${v.status==="rejected"&&canAct("resubmit")?`<button class="btn pri" id="mResub">Edit & resubmit</button>`:""}${v.status==="in"&&canAct("extendstay")?`<button class="btn" id="mExt">Extend stay (host permission)</button>`:""}<button class="btn" id="mNo">Close</button></div></div>`;
    m.hidden=false; $("#mNo").onclick=()=>m.hidden=true; if($("#mPass")) $("#mPass").onclick=()=>openPass(v); if($("#mExt")) $("#mExt").onclick=()=>doAct("extendstay",v); if($("#mResub")) $("#mResub").onclick=()=>doAct("resubmit",v); $("#mNo").focus();
  }
}
async function copyCsv(){
  const cols=["ref","name","org","type","host","backupHost","agency","building","room","vehicle","escort","status","tag","expected","arrivedAt","inAt","outAt"];
  const csv=[cols.join(",")].concat(visitors.map(v=>cols.map(c=>{let x=v[c]??"";if(/At$|expected/.test(c)&&x)x=new Date(x).toISOString();return '"'+String(x).replace(/"/g,'""')+'"'}).join(","))).join("\n");
  try{await navigator.clipboard.writeText(csv);toast("Report copied. Paste it into Excel.")}catch(e){modal(`<h2>Copy the report</h2><textarea id="m_csv" style="min-height:200px">${esc(csv)}</textarea>`,()=>{});setTimeout(()=>$("#m_csv").select(),0)}
}
async function ask(q){
  q=(q||"").trim(); if(!q||!aiReady()) return;
  if(!sample){ const entry={q,a:"Thinking…"}; chat.unshift(entry); render();
    try{ entry.a=(await callFn("assistant",{q})).text||"No answer."; }catch(e){ entry.a=e.message; }
    return render(); }
  const ctx=visitors.map(v=>({ref:v.ref,name:v.name,org:v.org,type:v.type,host:v.host,agency:v.agency,building:v.building,status:STATUS[v.status],tag:v.tag,expected:v.expected&&new Date(v.expected).toISOString(),inAt:v.inAt&&new Date(v.inAt).toISOString(),accessTo:v.accessTo&&new Date(v.accessTo).toISOString(),purpose:v.purpose}));
  const entry={q,a:"Thinking…"}; chat.unshift(entry); render();
  try{
    const r=await sample(`You are the operations assistant for the UN House Abuja visitor management system. Current time: ${new Date().toISOString()}. Overstay threshold: ${OVERSTAY_H} hours. Answer the security officer's question using only these visitor records (JSON). Be brief and factual, use plain text with short lines, name visitors with their reference numbers. If the records do not answer it, say so.\n\nRECORDS:\n${JSON.stringify(ctx)}\n\nQUESTION: ${q}`,{modelTier:"quick",cache:false,onText:({text})=>{entry.a=text;const el=document.querySelector(".ans");if(el)el.textContent=text}});
    entry.a=r.text;
  }catch(e){entry.a=e.code==="not_granted"?"The assistant was not allowed on this page.":e.code==="rate_limited"?"Too many questions. Try again in a minute.":"The assistant could not answer: "+(e.message||e.code)}
  render();
}
$("#yr").textContent=new Date().getFullYear();
(function initTheme(){
  const root=document.documentElement, btn=$("#themeBtn"), sBtn=$("#soundBtn");
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const syncBtn=()=>{if(!btn)return;const d=isDark();btn.innerHTML=d?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>':'<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';btn.title=d?"Switch to light mode":"Switch to dark mode"};
  const syncSound=()=>{if(!sBtn)return;const on=!!soundOn;sBtn.innerHTML=on?'<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>':'<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';sBtn.title=on?"Station sound & desktop alerts: ON (click to mute)":"Station sound & desktop alerts: OFF (click to enable)"};
  try{const saved=localStorage.getItem("theme");if(saved==="dark"||saved==="light")root.dataset.theme=saved}catch(e){}
  syncBtn(); syncSound();
  if(btn) btn.onclick=()=>{const next=isDark()?"light":"dark";root.dataset.theme=next;try{localStorage.setItem("theme",next)}catch(e){}syncBtn()};
  if(sBtn) sBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("soundAlerts",soundOn?"1":"0")}catch(e){}syncSound();if(soundOn){playChime();try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}toast("Station sound & desktop alerts enabled.")}else toast("Station sound alerts muted.")};
})();
document.addEventListener("keydown",e=>{if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){const q=$("#q");if(q){e.preventDefault();q.focus();q.select()}}});
const willUseFirebase=window.FIREBASE_CONFIG&&window.firebase&&!/PASTE/.test(window.FIREBASE_CONFIG.apiKey||"");
if(!willUseFirebase){view=defaultView(); render();} connect();
setInterval(()=>{if(!$("#modal").hidden||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;render()},60000);
</script>
