name: "UN Security Audit - CodeQL SAST"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Security & Anti-Backdoor Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Source Code for CodeQL Deep Scan
      run: |
        node -e "
          const fs = require('fs');
          const html = fs.readFileSync('un-house-access.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (m) {
            fs.writeFileSync('unvms-core.js', m[1], 'utf8');
            console.log('Extracted unvms-core.js (' + m[1].length + ' bytes) for CodeQL deep analysis.');
          }
        "

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
        upload: false
        output: sarif-results

    - name: Upload SARIF Security Audit Artifact for UN IT
      uses: actions/upload-artifact@v4
      with:
        name: CodeQL-UN-Security-Audit-Report
        path: sarif-results/
        retention-days: 30

    - name: Attempt Upload to GitHub Security Tab (If GHAS Licensed)
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: sarif-results/
        category: "/language:${{ matrix.language }}"

    - name: Generate UN Security Compliance Summary
      run: |
        echo "### 🛡️ UN IT Security Compliance · CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Application:** UN House Abuja VMS (Production)" >> $GITHUB_STEP_SUMMARY
        echo "- **Language Analyzed:** JavaScript & TypeScript (`javascript-typescript`)" >> $GITHUB_STEP_SUMMARY
        echo "- **Audit Ruleset:** Security Extended (OWASP Top 10, CWEs, Anti-Backdoor, Anti-Spyware)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Analysis Completed Successfully" >> $GITHUB_STEP_SUMMARY
        echo "- **Deliverable:** Official SARIF Security Certificate attached in Workflow Artifacts." >> $GITHUB_STEP_SUMMARY
