function loadScript(src){return loaded[src]||(loaded[src]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Could not load "+src));document.head.appendChild(s)}))}
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_W="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";
function bulkStatus(m){const o=$("#csvOut");if(o)o.textContent=m}
async function pdfLines(buf){
  await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_W;
  const pdf=await pdfjsLib.getDocument({data:buf}).promise; const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    bulkStatus(`Reading page ${p} of ${pdf.numPages}…`);
    const tc=await (await pdf.getPage(p)).getTextContent(); const rows={};
    tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],w:it.width,s:it.str})});
    Object.keys(rows).sort((a,b)=>b-a).forEach(y=>{const its=rows[y].sort((a,b)=>a.x-b.x);let line="",end=null;
      its.forEach(it=>{if(end!==null)line+=(it.x-end>10?"\t":" ");line+=it.s.trim();end=it.x+it.w});lines.push(line)});
  }
  return {lines,pdf};
}
async function ocrCanvasOrImage(srcs){
  await loadScript(TESS); bulkStatus("Starting text recognition (first time takes a few seconds)…");
  const w=await Tesseract.createWorker("eng",1,{logger:m=>{if(m.status==="recognizing text")bulkStatus(`Recognising text… ${Math.round(m.progress*100)}%`)}});
  await w.setParameters({preserve_interword_spaces:"1"});
  const lines=[];
  for(const s of srcs){const r=await w.recognize(s); r.data.text.split(/\n/).forEach(l=>lines.push(l.replace(/ {3,}/g,"\t")))}
  await w.terminate(); return lines;
}
async function scannedPdfLines(pdf){
  const canv=[];
  for(let p=1;p<=Math.min(pdf.numPages,10);p++){const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;canv.push(c)}
  return ocrCanvasOrImage(canv);
}
function splitLine(l){
  if(l.includes("\t")) return l.split("\t");
  if(l.includes("|")) return l.split("|");
  if(l.includes(",")){
    const res=[]; let cur="", inQ=false;
    for(let i=0; i<l.length; i++){
      const c=l[i];
      if(c==='"' && (i===0 || l[i-1]!=='\\')) inQ = !inQ;
      else if(c===',' && !inQ){ res.push(cur); cur=""; }
      else cur += c;
    }
    res.push(cur);
    return res;
  }
  return l.split(/\s{2,}/);
}

function toRows(lines){
  const rows=[];
  lines.map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const c=splitLine(l).map(s=>s.trim().replace(/^"|"$/g,"")).filter((s,i,a)=>s||i<a.length-1);
    if(!c[0]||/^(s\/?n|no\.?|#)?\s*(full\s*)?name\b/i.test(c.join(" "))&&rows.length===0) return; // header
    if(/^\d+\.?$/.test(c[0])) c.shift(); // leading row numbers from printed lists
    const emailIdx=c.findIndex(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
    const hostEmail=emailIdx>=0?c.splice(emailIdx,1)[0].toLowerCase():"";
    const typeIdx=c.findIndex(x=>/^(visitor|vip|contractor)$/i.test(x));
    const dateIdx=c.findIndex(x=>/\d{4}-\d{2}-\d{2}|\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}|\b\d{1,2}:\d{2}\b/.test(x));
    const rest=c.filter((_,i)=>i!==typeIdx&&i!==dateIdx);
    rows.push({hostEmail,name:rest[0]||"",org:rest[1]||"",host:rest[2]||"",agency:AGENCIES.find(a=>a.toLowerCase()===(rest[3]||"").toLowerCase())||rest[3]||"",
      type:typeIdx>=0?c[typeIdx].toLowerCase():"visitor",expected:dateIdx>=0?parseWhen(c[dateIdx]):"",purpose:rest.slice(4).join(" ")});
  });
  return rows;
}
function parseWhen(s){
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}T${(m[4]||"09").padStart(2,"0")}:${m[5]||"00"}`;
  m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}T${(m[4]||"09").padStart(2,"0")}:${m[5]||"00"}`} // day/month/year, as used in Nigeria
  m=s.match(/\b(\d{1,2}):(\d{2})\b/);
  if(m){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${m[1].padStart(2,"0")}:${m[2]}`}
  return "";
}
async function bulk(e){
  const file=e.target.files[0]; if(!file) return; bulkFile=file.name; bulkRows=[]; renderBulk();
  const hw=$("#hwList")&&$("#hwList").checked;
  try{
    if(hw&&/^(image\/|application\/pdf)/.test(file.type)){
      if(file.size>6e6) return bulkStatus("The file is over 6 MB. Take a smaller photo or split the PDF.");
      bulkStatus("Reading the handwritten list…");
      const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)});
      const out=await callFn("readList",{mime:file.type,data});
      bulkRows=(out.rows||[]).map(r=>({name:r.name||"",org:r.org||"",host:r.host||"",hostEmail:r.hostEmail||"",agency:r.agency||"",type:["vip","contractor"].includes(r.type)?r.type:"visitor",expected:r.expected||"",purpose:(r.uncertain?"[check] ":"")+(r.purpose||"")}));
      bulkStatus(bulkRows.length?`Read ${bulkRows.length} rows. Rows marked [check] were hard to read. Compare every row with the paper list.`:"No rows could be read. Try a clearer, straighter photo.");
      return renderBulk();
    }
    let lines;
    if(/\.csv$|text\/csv/i.test(file.name+" "+file.type)) lines=(await file.text()).split(/\r?\n/);
    else if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)){
      const {lines:l,pdf}=await pdfLines(await file.arrayBuffer());
      lines=l.join("").replace(/\s/g,"").length<20?(bulkStatus("This PDF is a scan. Recognising text…"),await scannedPdfLines(pdf)):l;
    } else if(/^image\//.test(file.type)) lines=await ocrCanvasOrImage([file]);
    else return bulkStatus("Use a CSV, PDF, or a photo or scan (JPG or PNG).");
    bulkRows=toRows(lines);
    bulkStatus(bulkRows.length?`Found ${bulkRows.length} rows in ${file.name}. Check them below, then register.`:`No visitor rows found in ${file.name}. Check the file is a list with one visitor per line.`);
    renderBulk();
  }catch(x){bulkStatus("Could not read the file: "+x.message)}
}

  $("#bulkGroup").oninput=e=>bulkGroup=e.target.value;
  $("#bulkCancel").onclick=()=>{bulkRows=[];renderBulk();bulkStatus("Discarded.");$("#csv").value=""};
  $("#bulkGo").onclick=async()=>{
    $("#bulkGo").setAttribute("disabled",""); let n=0;

        expected:ex,purpose:r.purpose.trim(),group:bulkGroup.trim(),building:BUILDINGS[0],restricted:false,

      if(r.type==="contractor"){const f0=day0(ex);v.accessFrom=f0;v.accessTo=f0+864e5-1}

    <div class="small">Requested by ${esc(v.requestedBy||v.host)}${v.decidedBy?` · ${v.status==="rejected"?"Rejected":"Approved"} by <b>${esc(v.decidedBy)}</b>${v.decidedAt?" ("+fmtD(v.decidedAt)+")":""}`:" · awaiting approval"}</div>${v.rejectReason?`<div class="small" style="color:var(--bad)">Rejection reason: <b>${esc(v.rejectReason)}</b></div>`:""}<div class="tw" style="max-height:240px;overflow:auto"><table><tbody>${(v.log||[]).slice().reverse().map(l=>`<tr><td class="mono">${fmtD(l.t)}</td><td>${esc(l.a)}<div class="small">${esc(l.by)} · ${esc(l.st)}</div></td></tr>`).join("")}</tbody></table></div>
    <div class="acts">${(v.escort||v.restricted)&&["tagged","in","arrived"].includes(v.status)?`<button class="btn pri" id="mEscort">${v.escortOfficer?"Change Escort":"Confirm Staff Escort Handshake"}</button>`:""}${passLive(v.status)&&canAct("pass")?`<button class="btn pri" id="mPass">Live digital pass</button>`:""}${v.status==="rejected"&&canAct("resubmit")?`<button class="btn pri" id="mResub">Edit & resubmit</button>`:""}${v.status==="in"&&canAct("extendstay")?`<button class="btn" id="mExt">Extend stay (host permission)</button>`:""}<button class="btn" id="mNo">Close</button></div></div>`;
    m.hidden=false; $("#mNo").onclick=$("#mX").onclick=()=>m.hidden=true; if($("#mPass")) $("#mPass").onclick=()=>openPass(v); if($("#mExt")) $("#mExt").onclick=()=>doAct("extendstay",v); if($("#mResub")) $("#mResub").onclick=()=>doAct("resubmit",v);
    if($("#mEscort")) $("#mEscort").onclick=()=>{
      modal(`<h2>Staff Escort Handshake · ${esc(v.name)}</h2><p class="small">Security requires physical handover to a designated staff member for restricted or escorted visits.</p>
        <div class="f"><label for="m_esc">Designated Staff Escort Name</label><input id="m_esc" value="${esc(v.escortOfficer||v.host||op())}"></div>`,
        ()=>{const escName=$("#m_esc").value.trim();if(!escName)return false;act(v,`Physical escort handed over to ${escName}`,{escortOfficer:escName,escortHandshakeAt:now()}).then(()=>toast(`Escort handshake logged for ${v.name}: ${escName}`));});
    };
    $("#mNo").focus();
  }
}
async function copyCsv(){
  const cols=["ref","name","org","type","backupHost","agency","building","room","vehicle","escort","status","tag","expected","arrivedAt","inAt","outAt"];
  const csv=[cols.join(",")].concat(visitors.map(v=>cols.map(c=>{let x=v[c]??"";if(/At$|expected/.test(c)&&x)x=new Date(x).toISOString();return '"'+String(x).replace(/"/g,'""')+'"'}).join(","))).join("\n");
  try{await navigator.clipboard.writeText(csv);toast("Report copied. Paste it into Excel.")}catch(e){modal(`<h2>Copy the report</h2><textarea id="m_csv" style="min-height:200px">${esc(csv)}</textarea>`,()=>{});setTimeout(()=>$("#m_csv").select(),0)}
}
async function ask(q){
  q=(q||"").trim(); if(!q||!aiReady()) return;
  if(!sample){ const entry={q,a:"Thinking…"}; chat.unshift(entry); render();
    try{ entry.a=(await callFn("assistant",{q})).text||"No answer."; }catch(e){ entry.a=e.message; }
    return render(); }
  const ctx=visitors.map(v=>({ref:v.ref,name:v.name,org:v.org,type:v.type,host:v.host,agency:v.agency,building:v.building,status:STATUS[v.status],tag:v.tag,expected:v.expected&&new Date(v.expected).toISOString(),inAt:v.inAt&&new Date(v.inAt).toISOString(),accessTo:v.accessTo&&new Date(v.accessTo).toISOString(),purpose:v.purpose}));
  const entry={q,a:"Thinking…"}; chat.unshift(entry); render();
  try{
    const r=await sample(`You are the operations assistant for the UN House Abuja visitor management system. Current time: ${new Date().toISOString()}. Overstay threshold: ${OVERSTAY_H} hours. Answer the security officer's question using only these visitor records (JSON). Be brief and factual, use plain text with short lines, name visitors with their reference numbers. If the records do not answer it, say so.\n\nRECORDS:\n${JSON.stringify(ctx)}\n\nQUESTION: ${q}`,{modelTier:"quick",cache:false,onText:({text})=>{entry.a=text;const el=document.querySelector(".ans");if(el)el.textContent=text}});
    entry.a=r.text;
  }catch(e){entry.a=e.code==="not_granted"?"The assistant was not allowed on this page.":e.code==="rate_limited"?"Too many questions. Try again in a minute.":"The assistant could not answer: "+(e.message||e.code)}
  render();
}

(function initTheme(){
  const root=document.documentElement, btn=$("#themeBtn"), sBtn=$("#soundBtn");
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const syncBtn=()=>{if(!btn)return;const d=isDark();btn.innerHTML=d?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>':'<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';btn.title=d?"Switch to light mode":"Switch to dark mode"};
  const syncSound=()=>{if(!sBtn)return;const on=!!soundOn;sBtn.innerHTML=on?'<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>':'<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';sBtn.title=on?"Station sound & desktop alerts: ON (click to mute)":"Station sound & desktop alerts: OFF (click to enable)"};
  try{const saved=localStorage.getItem("theme");if(saved==="dark"||saved==="light")root.dataset.theme=saved}catch(e){}
  syncBtn(); syncSound();
  if(btn) btn.onclick=()=>{const next=isDark()?"light":"dark";root.dataset.theme=next;try{localStorage.setItem("theme",next)}catch(e){}syncBtn()};
  if(sBtn) sBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("soundAlerts",soundOn?"1":"0")}catch(e){}syncSound();if(soundOn){playChime();try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}toast("Station sound & desktop alerts enabled.")}else toast("Station sound alerts muted.")};
})();
