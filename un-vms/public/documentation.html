<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation &amp; Tagging</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="grid cols-2">
    <section class="panel">
      <div class="panel-head"><h2>Arriving — exchange ID for tag</h2><span class="count" id="nQueue">0</span></div>
      <p class="small muted" style="margin-top:-.4rem">Visitors cleared by Reception. Match the tag number, take the government ID, hand over the tag.</p>
      <div id="queue" class="list"></div>
    </section>
    <section>
      <div class="panel">
        <div class="panel-head"><h2>Check-out — return ID</h2></div>
        <input id="q" class="search" placeholder="Tag number or name…" autocomplete="off" aria-label="Find visitor to check out">
        <div id="outResults" class="list" style="margin-top:.75rem"></div>
      </div>
      <div class="panel" style="margin-top:1.25rem">
        <div class="panel-head"><h2>ID tray — on site</h2><span class="count" id="nTray">0</span></div>
        <div class="table-wrap"><table><thead><tr><th>Tag</th><th>Visitor</th><th>ID held</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody id="tray"></tbody></table></div>
      </div>
    </section>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/documentation.js"></script>
</body>
</html>
