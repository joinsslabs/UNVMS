<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Visitor Management</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login" id="login">
    <div class="logo">UN</div>
    <h1 style="font-size:1.35rem">Access &amp; Visitor Management</h1>
    <p class="muted" style="margin-top:0">UN Common Services — sign in to your station</p>
    <div class="field"><label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err-msg" id="err"></div>
    <button class="primary big" style="width:100%;justify-content:center">Sign in</button>
    <p class="small muted" style="margin-bottom:0">Stations: Reception (Access Control) · Documentation &amp; Tagging · Main Building Reception · VIP Gate · Staff / Manager</p>
  </form>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
